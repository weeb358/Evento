project_id = "events-platform-pk"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

# Phone auth removed entirely — email (password or Google) is the only
# sign-in method. See docs/ARCHITECTURE.md.

[auth.email]
enable_signup = true
enable_confirmations = true
# Overrides the default magic-link confirmation email with one containing a
# 6-digit code instead — the app collects it and calls
# `verifyOtp({email, token, type: 'signup'})` rather than the user clicking
# a link. See supabase/templates/confirm_signup.html.
[auth.email.template.confirmation]
subject = "Confirm your Events Platform account"
content_path = "./supabase/templates/confirm_signup.html"

# Custom SMTP is required to unlock custom templates on the free tier —
# configured directly in the Supabase Dashboard (Project Settings >
# Authentication > SMTP Settings) using a Gmail App Password, since the
# CLI wasn't linked at setup time. This block documents it for a future
# `supabase config push`.
[auth.email.smtp]
enabled = true
host = "smtp.gmail.com"
port = 587
user = "env(GMAIL_SMTP_USER)"
pass = "env(GMAIL_SMTP_PASS)"
sender_name = "Evento"

# Also enabled directly in the Supabase Dashboard (Authentication >
# Providers > Google) since the CLI wasn't linked when this was set up —
# this block just keeps a future `supabase config push` in sync.
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"

[storage]
enabled = true
file_size_limit = "10MiB"

[realtime]
enabled = true
