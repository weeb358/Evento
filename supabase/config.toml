project_id = "events-platform-pk"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

# Phone auth removed entirely — email (password or Google) is the only
# sign-in method. See docs/ARCHITECTURE.md.

[auth.email]
enable_signup = true
enable_confirmations = true
# Overrides the default magic-link confirmation email with one containing a
# 6-digit code instead — the app collects it and calls
# `verifyOtp({email, token, type: 'signup'})` rather than the user clicking
# a link. See supabase/templates/confirm_signup.html.
[auth.email.template.confirmation]
subject = "Confirm your Events Platform account"
content_path = "./supabase/templates/confirm_signup.html"

# Flip to `enabled = true` once GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET are
# set in supabase/.env — see docs/ARCHITECTURE.md for how to get them.
[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"

[storage]
enabled = true
file_size_limit = "10MiB"

[realtime]
enabled = true
