<!DOCTYPE html>
<html>
  <body style="font-family: -apple-system, Helvetica, Arial, sans-serif; background: #F7F6F4; padding: 32px;">
    <div style="max-width: 420px; margin: 0 auto; background: #FFFFFF; border-radius: 12px; padding: 32px; text-align: center;">
      <p style="font-size: 20px; font-weight: 600; color: #171412; margin: 0 0 8px;">Confirm your account</p>
      <p style="font-size: 14px; color: #6B6560; margin: 0 0 24px;">
        Enter this code in the app or website to finish creating your account.
      </p>
      <p style="font-size: 32px; font-weight: 700; letter-spacing: 6px; color: #FF5A3C; margin: 0 0 24px;">
        {{ .Token }}
      </p>
      <p style="font-size: 12px; color: #6B6560; margin: 0;">
        This code expires shortly. If you didn't request this, you can ignore this email.
      </p>
    </div>
  </body>
</html>
